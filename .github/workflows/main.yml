name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Restore or Generate debug.keystore & .env
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore with keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Outputs
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/KhusbooFood.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhusbooFood-Debug-APK
          path: app/build/outputs/apk/debug/KhusbooFood.apk

      - name: Publish GitHub Release (Direct APK Link for Mobile)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Khushboo Food App v1.0.${{ github.run_number }}"
          body: |
            ## 📱 Khushboo Food Android App
            
            ### ⬇️ Direct Download
            Click **`KhusbooFood.apk`** below to download directly to your Android device.
            
            ### ✨ Features:
            - **Explore Categories**: Premium circular food category navigation
            - **Vertical Product Feed**: Real-time kitchen delicacies loaded directly from database
            - **Dynamic Weight Selector**: 250g, 500g, 1kg, 2kg with live dynamic pricing
            - **Pieces Selector**: Units selector for bakery and snacks
            - **Add to Cart & Checkout**: Seamless ordering with multi-store validation
          files: |
            app/build/outputs/apk/debug/KhusbooFood.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
